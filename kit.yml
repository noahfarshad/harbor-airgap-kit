# kit.yml: what the next transfer carries into an air-gapped environment.
#
# On the connected workstation (WSL or Linux), from this folder:
#   python3 kit check     checks this file, and that every source can be reached
#   python3 kit fetch     downloads and verifies everything into one transfer folder
#
# Inside the environment, TRANSFER.txt in the transfer folder lists the commands:
# python3 kit publish, make build-registry, python3 kit load.

name: harbor-2.15.2                     # the transfer folder's name

output:
  dir: ~/kit-transfer                   # built here, on the Linux side
  windows_copy: true                    # under WSL, also copied to C:\Users\<you>\kit-transfer\<name>

tools:                                  # installed into ~/.local/bin when missing, checked against release checksums
  cosign: latest                        # or a release tag, e.g. v3.1.3
  imgpkg: latest                        # or e.g. v0.48.2

harbor:
  version: "2.15.2"
  verify_signature: true                # cosign checks Harbor's signature; keep it on for anything that goes in
  compose_provider: docker-compose      # docker-compose (Docker's binary) | podman-compose (from EPEL)
  docker_compose_version: v5.5.1        # docker-compose only
  # epel_mirror: https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64   # podman-compose only

docker_ce:                              # Docker Engine RPMs, for environments on Docker whose own
  enabled: false                        # repositories don't carry Docker CE (needs zstd on this machine)
  # repo: https://download.docker.com/linux/rhel/9/x86_64/stable

broadcom:                               # what goes into Harbor; 'kit load' pushes it inside
  environments: all                     # carry the Broadcom items these inventories turn on in
                                        #   group_vars/registry/broadcom.yml (all: every inventory
                                        #   but _template). python3 kit catalog shows the choices
  services_dir: broadcom/services       # the Supervisor Service YAMLs from Broadcom; every bundle
  services_project: sup-services        #   they name is fetched too, and goes to this Harbor project
  bundles: []                           # anything the catalog doesn't have, for every environment:
    # - ref: projects.packages.broadcom.com/<path>:<tag>
    #   project: <Harbor project>

files: []                               # other downloads, for example Kubernetes release OVAs:
  # - url: https://wp-content.broadcom.com/v2/latest/<release>/<file>
  #   sha256: <optional; checked when given>
