---
# inventories/edge-qa/group_vars/all/nexus.yml
#
# Only for make configure-nexus ENV=<env>: the repositories, roles and accounts
# the kit needs, created through Nexus's REST API (roles/configure_nexus). Leave
# this file as it is if the environment's Nexus admin sets them up by hand.

nexus_admin_user:          admin
nexus_admin_password:      "{{ vault_nexus_admin_password | default('') }}"
nexus_read_user:           "{{ vault_repo_username | default('kit-read', true) }}"     # Ansible and dnf read the Harbor files with it
nexus_read_password:       "{{ vault_repo_password | default('') }}"
nexus_upload_user:         "{{ vault_nexus_upload_user | default('kit-upload', true) }}"   # kit publish uploads with it
nexus_upload_password:     "{{ vault_nexus_upload_password | default('') }}"
nexus_anonymous_access:    false
nexus_yum_repo_enabled:    true             # only podman-compose kits use it
nexus_accept_eula:         false            # an existing Nexus has accepted it already
