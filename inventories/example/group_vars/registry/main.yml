---
# inventories/example/group_vars/registry/main.yml
#
# essential.coach lab example. The three arrival questions are settings:
#   nexus_enabled: false          Harbor files come from the staged transfer
#   harbor_tls_mode: staged       certificate staged from a CA the Supervisor trusts
#   harbor_container_runtime: podman
#
# Every Harbor setting for this environment. Values that match the role
# defaults are written out anyway, so everything is in one place. The release (version + sha256) is next door in
# harbor_artifacts.yml; the server, registry name and data disk are in
# host_vars/<host>.yml; passwords are in group_vars/all/vault.yml.

# =============================================================================
# Container runtime
# =============================================================================
harbor_container_runtime:        podman            # podman | docker
# Switch runtime only after a remove. Docker CE has to be available first
# (the server's repos, or docker_ce.enabled: true in kit.yml). Then:
#   make remove-registry ENV=example
#   set harbor_container_runtime: docker
#   make build-registry ENV=example
# The lab does this for you: make lab-demo RUNTIME=docker, and RUNTIME=podman moves it back.
harbor_podman_compose_provider:  docker-compose  # must match kit.yml harbor.compose_provider
                                                   # docker-compose (one static binary) | podman-compose (EPEL RPMs)
harbor_podman_socket:            /run/podman/podman.sock   # used by the docker-compose provider
harbor_podman_log_driver:        journald          # Podman has no syslog driver
harbor_compose_project:          harbor

# --- Podman: podman from the server's own repositories, the compose provider from the transfer
podman_offline_packages:
  - podman
  - container-selinux
  - policycoreutils-python-utils
  - netavark                                       # named explicitly: without aardvark-dns, Harbor's
  - aardvark-dns                                   # containers can't resolve each other by name
podman_offline_compose_source:      "{{ 'yum' if nexus_enabled | bool else 'staged' }}"   # podman-compose only
podman_offline_yum_repo_url:        "{{ nexus_url }}/repository/{{ nexus_yum_repo }}/"
podman_offline_yum_gpgkey:          "{{ artifact_repo_url }}/{{ harbor_artifact_path }}/RPM-GPG-KEY-EPEL-9"
podman_offline_yum_username:        "{{ artifact_repo_username }}"
podman_offline_yum_password:        "{{ artifact_repo_password }}"
podman_offline_rpm_path:            "{{ harbor_artifact_path }}/podman"
podman_offline_landing_dir:         "{{ stage_root }}/podman-rpms"
podman_offline_disable_gpg_check:   false          # true only if the EPEL key isn't imported on the server
podman_offline_docker_compose_file: "{{ harbor_artifact_path }}/docker-compose-linux-x86_64"
podman_offline_docker_compose_bin:  /usr/local/bin/docker-compose
# podman_offline_docker_compose_sha256 comes from harbor_artifacts.yml

# --- Docker: read only when harbor_container_runtime: docker ------------------
docker_offline_source:             yum             # yum = the server's own repositories carry Docker CE
                                                   # staged = RPMs in the kit (kit.yml docker_ce.enabled: true)
docker_offline_rpm_path:           "{{ harbor_artifact_path }}/docker"
docker_offline_landing_dir:        "{{ stage_root }}/docker-rpms"
docker_offline_allowerasing:       true
docker_offline_disable_gpg_check:  false
docker_offline_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# =============================================================================
# Kit and layout on the registry server
# =============================================================================
harbor_artifact_path:       harbor                 # where the Harbor files sit under artifact_staging
harbor_download_dir:        "{{ stage_root }}/harbor"
harbor_install_parent:      "{{ install_root }}"
harbor_install_dir:         "{{ harbor_install_parent }}/harbor"
harbor_data_require_mount:  false                   # true: stop unless harbor_data_volume is its own disk
harbor_http_port:           80                     # redirects to 443
harbor_https_port:          443                    # both ports must be free on the server
harbor_with_trivy:          false                  # no vulnerability feed inside an air gap
harbor_manage_systemd:      true
harbor_manage_selinux:      true                   # label Harbor's paths container_file_t
harbor_cert_sync:           true                   # carry a renewed certificate into Harbor
harbor_upgrade_backup_db:   true                   # copy the database before a Harbor upgrade

# --- desired_state: absent (remove_registry.yml) only -------------------------
harbor_purge_install:       false
harbor_purge_data:          false                  # true empties harbor_data_volume: registry content

# =============================================================================
# Credentials: values in group_vars/all/vault.yml
# =============================================================================
harbor_admin_password:      "{{ vault_harbor_admin_password }}"
harbor_db_password:         "{{ vault_harbor_db_password }}"

# =============================================================================
# Projects: the layout the Supervisor and VKS pull from
# =============================================================================
harbor_projects:
  - name: library                                  # created by Harbor
    public: true
  - name: sup-services                             # Supervisor Service bundles
    public: true
  - name: tanzu-packages                           # VKS standard packages repository
    public: true
  - name: tkg                                      # VKS package images
    public: true

# =============================================================================
# Certificate
# =============================================================================
# staged: a certificate and key for harbor_hostname from any CA the Supervisor
#         and VKS will trust, and that CA, in <artifact_staging>/tls/ on the control
#         host (artifact_staged_on: controller) or the registry server (target):
#         <harbor_hostname>.crt, <harbor_hostname>.key and ca.crt.
# ipa:    only if the server is enrolled in IdM: IdM issues the certificate and
#         certmonger renews it.
harbor_tls_mode:              staged               # staged | ipa
harbor_tls_cert:              "/etc/pki/tls/certs/{{ harbor_hostname }}.crt"
harbor_tls_key:               "/etc/pki/tls/private/{{ harbor_hostname }}.key"
# harbor_tls_staged_cert:     "{{ artifact_staging }}/tls/{{ harbor_hostname }}.crt"
# harbor_tls_staged_key:      "{{ artifact_staging }}/tls/{{ harbor_hostname }}.key"
# harbor_tls_staged_ca:       "{{ artifact_staging }}/tls/ca.crt"   # "" if the server already trusts it
harbor_tls_principal:         "HTTP/{{ harbor_hostname }}"         # ipa only
harbor_tls_ipa_wait_retries:  30
harbor_tls_ipa_wait_delay:    10
# =============================================================================
# API checks and verification
# =============================================================================
harbor_api_url:               "https://{{ harbor_hostname }}:{{ harbor_https_port }}/api/v2.0"
harbor_api_validate_certs:    true                 # the server trusts the certificate's CA (harbor_tls_staged_ca)
harbor_api_wait_retries:      60
harbor_api_wait_delay:        10
harbor_verify_cert_warn_days: 30
harbor_verify_expected_containers:
  - nginx
  - harbor-core
  - harbor-portal
  - harbor-jobservice
  - harbor-db
  - registry
  - registryctl
  - redis

# =============================================================================
# Host firewall
# =============================================================================
firewall_open_tcp_ports:
  - 22
  - "{{ harbor_http_port }}"
  - "{{ harbor_https_port }}"
