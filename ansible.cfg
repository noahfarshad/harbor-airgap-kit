# ansible.cfg for harbor-airgap-kit
#
# No default inventory on purpose: every run names its environment
# (make ... ENV=<env>, or ansible-playbook -i inventories/<env>/hosts).

[defaults]
roles_path              = roles
collections_path        = collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python      = auto_silent
forks                   = 10
retry_files_enabled     = False
callback_result_format  = yaml
inject_facts_as_vars    = False          # facts only through ansible_facts, as ansible-core 2.24 will require

[privilege_escalation]
become_method           = sudo
