---
# inventories/example/host_vars/registry01.yml
#
# Filled the way the essential.coach lab records a site. Copy this directory
# to inventories/<env> and replace example.coach with the site's names.
# registry01 is the inventory name. The server's own name and the registry
# name are different, so the registry can move later.

registry_server_fqdn:   registry01.example.coach
ansible_host:           "{{ registry_server_fqdn }}"
harbor_hostname:        registry.example.coach
harbor_data_volume:     /data
