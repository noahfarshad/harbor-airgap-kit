---
# tasks file for install_docker_offline: present

- name: Install Docker Engine and Compose from the environment repository
  ansible.builtin.dnf:
    name: "{{ docker_offline_packages }}"
    state: present
    allowerasing: "{{ docker_offline_allowerasing }}"
  when: docker_offline_source == 'yum'

- name: Find the staged Docker RPMs on the registry host
  ansible.builtin.find:
    paths: "{{ artifact_staging }}/{{ docker_offline_rpm_path }}"
    patterns: "*.rpm"
  register: docker_offline_rpms_target
  when:
    - docker_offline_source == 'staged'
    - artifact_staged_on | default('target') == 'target'

- name: Find the staged Docker RPMs on the control host
  ansible.builtin.find:
    paths: "{{ artifact_staging }}/{{ docker_offline_rpm_path }}"
    patterns: "*.rpm"
  register: docker_offline_rpms_controller
  delegate_to: localhost
  become: false
  when:
    - docker_offline_source == 'staged'
    - artifact_staged_on | default('target') == 'controller'

- name: Create a landing directory for RPMs copied from the control host
  ansible.builtin.file:
    path: "{{ docker_offline_landing_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - docker_offline_source == 'staged'
    - artifact_staged_on | default('target') == 'controller'

- name: Copy Docker's signing key from the control host
  ansible.builtin.copy:
    src: "{{ artifact_staging }}/{{ docker_offline_gpg_key }}"
    dest: "{{ docker_offline_landing_dir }}/{{ docker_offline_gpg_key | basename }}"
    mode: "0644"
  when:
    - docker_offline_source == 'staged'
    - artifact_staged_on | default('target') == 'controller'
    - not (docker_offline_disable_gpg_check | bool)

- name: Copy the RPMs from the control host
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ docker_offline_landing_dir }}/{{ item.path | basename }}"
    mode: "0640"
  loop: "{{ docker_offline_rpms_controller.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - docker_offline_source == 'staged'
    - artifact_staged_on | default('target') == 'controller'

- name: Build the list of RPMs to install
  ansible.builtin.set_fact:
    docker_offline_rpm_files: >-
      {{ (docker_offline_rpms_target.files | default([]) | map(attribute='path') | list)
         if artifact_staged_on | default('target') == 'target'
         else (docker_offline_rpms_controller.files | default([])
               | map(attribute='path') | map('basename')
               | map('regex_replace', '^', docker_offline_landing_dir ~ '/') | list) }}
  when: docker_offline_source == 'staged'

- name: Stop if no staged RPMs were found
  ansible.builtin.assert:
    that:
      - docker_offline_rpm_files | length > 0
    fail_msg: "No RPMs under {{ artifact_staging }}/{{ docker_offline_rpm_path }} ({{ artifact_staged_on | default('target') }})."
    quiet: true
  when: docker_offline_source == 'staged'

# dnf checks each staged RPM's signature against the keys rpm knows; the transfer
# carries Docker's, checked against SHA256SUMS on the way in.
- name: Import Docker's signing key from the transfer
  ansible.builtin.rpm_key:
    key: >-
      {{ (docker_offline_landing_dir ~ '/' ~ (docker_offline_gpg_key | basename))
         if artifact_staged_on | default('target') == 'controller'
         else (artifact_staging ~ '/' ~ docker_offline_gpg_key) }}
    state: present
  when:
    - docker_offline_source == 'staged'
    - not (docker_offline_disable_gpg_check | bool)

# The transfer carries the Docker packages; what they depend on comes from the
# server's own repositories. Only packages this host doesn't have yet are
# installed from the transfer, so installed packages stay at the environment's
# own patch level.
- name: Install only the staged packages this host is missing
  when: docker_offline_source == 'staged'
  block:
    - name: Read the package name in each staged RPM
      ansible.builtin.command:
        argv: "{{ ['rpm', '-qp', '--nosignature', '--nodigest', '--queryformat', '%{NAME}\\n'] + docker_offline_rpm_files }}"
      register: docker_offline_rpm_names
      changed_when: false

    - name: Read the installed packages
      ansible.builtin.package_facts:
        manager: rpm

    - name: Keep the staged RPMs whose package is not installed
      ansible.builtin.set_fact:
        docker_offline_rpm_install: >-
          {{ docker_offline_rpm_files | zip(docker_offline_rpm_names.stdout_lines)
             | rejectattr('1', 'in', ansible_facts.packages.keys() | list)
             | map(attribute='0') | list }}

    - name: Install Docker Engine and Compose from the staged RPMs
      ansible.builtin.dnf:
        name: "{{ docker_offline_rpm_install }}"
        state: present
        allowerasing: "{{ docker_offline_allowerasing }}"
        disable_gpg_check: "{{ docker_offline_disable_gpg_check }}"
      when: docker_offline_rpm_install | length > 0

- name: Start Docker and enable it at boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Confirm Docker Compose v2 is available
  ansible.builtin.command: docker compose version --short
  register: docker_offline_compose
  changed_when: false

- name: Report the Compose version
  ansible.builtin.debug:
    msg: "Docker Compose {{ docker_offline_compose.stdout }}"
