---
# inventories/coach-dev/group_vars/all/artifacts.yml
#
# Where this environment gets the Harbor files. A transfer is built on a connected
# workstation (python3 kit fetch) and carried in. python3 kit publish stages the
# Harbor files on the control host and the build reads them from there. If the
# environment has a Nexus and you want the files kept in it, set nexus_enabled:
# true: kit publish uploads them, and the roles and dnf read them from Nexus.

nexus_enabled:                false         # true: keep the Harbor files in this environment's Nexus
artifact_source:              "{{ 'repo' if nexus_enabled | bool else 'staged' }}"

# --- Nexus, only with nexus_enabled: true -----------------------------------------------
nexus_url:                    "https://CHANGE_ME-nexus.example.com"
nexus_raw_repo:               vmware-raw    # raw (hosted): installers, manifests, keys
nexus_yum_repo:               harbor-epel   # yum (hosted), repodata depth 0: podman-compose kits
artifact_repo_url:            "{{ nexus_url }}/repository/{{ nexus_raw_repo }}"
artifact_repo_username:       "{{ vault_repo_username | default('') }}"   # empty = anonymous read
artifact_repo_password:       "{{ vault_repo_password | default('') }}"
artifact_repo_headers:        {}
artifact_repo_validate_certs: true          # Nexus's certificate must chain to a CA the servers trust

# --- Without Nexus --------------------------------------------------------------------
artifact_staged_on:           controller    # controller = Ansible control host | target = the registry server
