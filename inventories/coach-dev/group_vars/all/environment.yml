---
# inventories/coach-dev/group_vars/all/environment.yml
#
# Facts the essential.coach lab records for this example. The Harbor roles do
# not read these directly. Addresses are documentation ranges, not a site.

env_name:             coach-dev
env_description:      "essential.coach lab, dev"
env_prefix:           coach
domain:               example.coach

ipa_domain:           "{{ domain }}"
ipa_realm:            EXAMPLE.COACH
ipa_servers:
  - idm.example.coach
ipa_ca_cert:          /etc/ipa/ca.crt
dns_zone:             "{{ domain }}"
dns_reverse_zones:
  - 2.0.192.in-addr.arpa.
  - 100.51.198.in-addr.arpa.
ntp_servers:
  - ntp.example.coach

vcenter_hostname:     vc.example.coach
vcenter_ip:           192.0.2.12
vsphere_datacenter:   coach-dc
vsphere_cluster:      coach-cluster
esxi_hosts:
  - { name: esx1, ip: 192.0.2.1 }
  - { name: esx2, ip: 192.0.2.2 }
  - { name: esx3, ip: 192.0.2.3 }
vsphere_datastores:   [DS1, DS2, DS3]
vsphere_tkg_datastores: [DS1, DS3]
vds_name:             COACH-VDS
vds_uplink_portgroup: COACH-VDS-DVUplinks

networks:
  mgmt:
    portgroup: vds-mgmt
    vlan:      101
    cidr:      192.0.2.0/24
  data:
    portgroup: vds-data
    vlan:      100
    cidr:      198.51.100.0/24
  workload:
    portgroup: vds-wkld
    vlan:      102
    cidr:      203.0.113.0/24

supervisor_api_vip:   198.51.100.20
contour_envoy_vip:    198.51.100.22
avi_controller_ip:    192.0.2.40
avi_controller_fqdn:  lb.example.coach
vks_clusters:         [coach-cluster]
harbor_supervisor_service: harbor.tanzu.example.coach
offline_harbor_ip:    192.0.2.66
offline_harbor_url:   "https://{{ offline_harbor_ip }}"
