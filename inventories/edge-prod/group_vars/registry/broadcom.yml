# group_vars/registry/broadcom.yml: what this environment's Harbor gets from Broadcom.
#
# The items and their versions are in broadcom/catalog.yml. For each one:
#   true                  the catalog's default version
#   "1.33.5"              that version (in quotes)
#   ["3.6.3", "3.7.1"]    several, e.g. to carry an upgrade path
#   false                 left out
#
# python3 kit fetch carries whatever any environment turns on, make build-registry
# creates the Harbor projects they go to, and python3 kit load --env <env> pushes
# this environment's. python3 kit catalog shows the list and who has what on.

broadcom_items:
  # Supervisor Services. Their YAMLs come from support.broadcom.com: put them in
  # broadcom/services/ and kit load writes copies that point at this Harbor.
  argocd-service: false
  contour: false
  external-dns: false
  velero-operator: false
  consumption-interface: false
  ca-clusterissuer: false
  harbor-service: false
  secret-store: false                   # VCF 9
  dsm-consumption-operator: false       # only with DSM
  supervisor-management-proxy: false    # VCF 9
  nsx-management-proxy: false           # vSphere 8 with NSX
  # VKS
  vks: false                            # VKS itself, for upgrades
  vks-addons: false                     # the release that matches this environment's VKS
  # In VKS clusters
  ako: false
