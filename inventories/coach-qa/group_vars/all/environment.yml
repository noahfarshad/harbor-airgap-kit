---
# inventories/coach-qa/group_vars/all/environment.yml
#
# Facts about this environment, kept in one place. The Harbor roles don't read
# any of these directly, but host_vars and the runbook refer to them, and any
# roles you add later can use them as they are. Note where each value came from:
# seen in the environment, or a guess you still need to confirm.

# --- Environment ------------------------------------------------------------------
env_name:             coach-qa                      # the inventory directory's name
env_description:      "essential.coach coach-qa"
domain:               example.coach

# --- Identity, DNS, time -----------------------------------------------------------
ipa_domain:           "{{ domain }}"
ipa_realm:            EXAMPLE.COACH
ipa_servers: []                                      # e.g. [idm1.example.com, idm2.example.com]
ipa_ca_cert:          /etc/ipa/ca.crt                # present on every IdM-enrolled server
dns_zone:             "{{ domain }}"
ntp_servers: []

# --- vSphere ------------------------------------------------------------------------
vcenter_hostname:     vc.example.coach
vsphere_datacenter:   CHANGE_ME
vsphere_cluster:      CHANGE_ME

# --- Networks -------------------------------------------------------------------------
networks: {}
#   mgmt:     { portgroup: CHANGE_ME, vlan: 0, cidr: 192.0.2.0/24 }
#   workload: { portgroup: CHANGE_ME, vlan: 0, cidr: 198.51.100.0/24 }

# --- Supervisor ------------------------------------------------------------------------
supervisor_api_vip:   ""
vks_clusters: []
