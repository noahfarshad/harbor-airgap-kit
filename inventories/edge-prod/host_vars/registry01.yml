---
# inventories/edge-prod/host_vars/registry01.yml
#
# The registry server in this environment.

# --- The server -----------------------------------------------------------------
# An existing RHEL 9 server: ports 80 and 443 free, and reachable on 443 from the
# Supervisor's management network and the VKS workload networks.
registry_server_fqdn:   example.coach
ansible_host:           "{{ registry_server_fqdn }}"

# --- The registry name ------------------------------------------------------------
# What the Supervisor, VKS nodes and pushes use. Give it its own DNS record and
# make it the subject of the certificate, so the registry can later move to
# another server without re-pointing the Supervisor.
harbor_hostname:        CHANGE_ME-registry.example.com

# --- Registry content -----------------------------------------------------------
# A separate disk mounted here before the first build (harbor_data_require_mount
# in group_vars/registry/main.yml checks it). Size it for every image the
# Supervisor and VKS will pull, with room to grow.
harbor_data_volume:     /data
