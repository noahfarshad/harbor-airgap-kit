---
# inventories/coach-qa/group_vars/all/main.yml
#
# Settings everything in this environment shares.

# --- Connection ---------------------------------------------------------------
ansible_python_interpreter:  /usr/bin/python3
# ansible_user:              # set only if the control host's default account is not
#                            # the one Ansible signs in with; its sudo must not prompt

# --- Paths on every managed server ---------------------------------------------
install_root:        /opt
stage_root:          /var/staging
artifact_staging:    /var/staging/artifacts   # where kit publish stages transfers on the control host

# --- Host firewall ----------------------------------------------------------------
enable_firewall:     true                     # firewalld stays on; each block opens its own ports
