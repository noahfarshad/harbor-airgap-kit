---
# inventories/dev/group_vars/all/environment.yml
#
# Facts the essential.coach lab records for this example. The Harbor roles don't
# read any of these directly, but host_vars and the runbook refer to them, and any
# roles you add later can use them as they are. Names are example.coach and
# addresses are documentation ranges, not a site.

# --- Environment ------------------------------------------------------------------
env_name:             dev                            # the inventory directory's name
env_description:      "essential.coach lab, dev"
domain:               example.coach

# --- Identity, DNS, time -----------------------------------------------------------
ipa_domain:           "{{ domain }}"
ipa_realm:            EXAMPLE.COACH
ipa_servers:                                         # the IdM servers, if there are any
  - idm.example.coach
ipa_ca_cert:          /etc/ipa/ca.crt                # present on every IdM-enrolled server
dns_zone:             "{{ domain }}"
ntp_servers:
  - ntp.example.coach

# --- vSphere ------------------------------------------------------------------------
vcenter_hostname:     vc.example.coach
vsphere_datacenter:   coach-dc
vsphere_cluster:      coach-cluster

# --- Networks -------------------------------------------------------------------------
networks:
  mgmt:     { portgroup: vds-mgmt, vlan: 101, cidr: 192.0.2.0/24 }
  workload: { portgroup: vds-wkld, vlan: 102, cidr: 203.0.113.0/24 }

# --- Supervisor ------------------------------------------------------------------------
supervisor_api_vip:   198.51.100.20
vks_clusters:         [coach-cluster]
