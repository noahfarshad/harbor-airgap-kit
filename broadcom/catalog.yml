# broadcom/catalog.yml: the Broadcom content this kit knows how to carry.
#
# Each environment turns items on in inventories/<env>/group_vars/registry/broadcom.yml:
#
#   broadcom_items:
#     argocd-service: true          # the default version below
#     contour: "1.33.5"             # this version
#     vks: ["3.6.3", "3.7.1"]       # several, e.g. to carry an upgrade path
#     velero-operator: false        # not this one
#
# python3 kit fetch carries what any environment turns on, make build-registry
# creates the Harbor projects they go to, and python3 kit load --env <env> pushes
# that environment's items. python3 kit catalog shows what is here and who uses it.
#
# Every reference below was read from projects.packages.broadcom.com on
# 2026-10-05; none of them needs a Broadcom login. To add a version, put it at
# the top of the item's versions and run python3 kit check.
#
# kind:
#   supervisor-service   a bundle the Supervisor installs from; its YAML comes from
#                        support.broadcom.com (vSphere Supervisor Services; on VCF 9.1,
#                        the "legacy" YAML) and goes in broadcom/services/
#   addon-repository     the repository VKS clusters install add-ons from
#   images               images and Helm charts, copied as they are
# repo_path_after:       keep the source path after this in Harbor, instead of only
#                        its last part (so a chart and an image of the same name
#                        don't land in the same repository)

